plugins {
    id 'com.android.application'
}

android {
    namespace 'ph.davin.autoswipe'
    compileSdk 35

    defaultConfig {
        applicationId 'ph.davin.autoswipe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
